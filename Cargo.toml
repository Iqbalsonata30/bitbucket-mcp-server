[package]
name = "bitbucket-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Model Context Protocol server for Bitbucket Server and Data Center"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
