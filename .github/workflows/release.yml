name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release
      - run: |
          mkdir -p dist
          cp target/release/bitbucket-mcp-server LICENSE README.md dist/
          tar -C dist -czf bitbucket-mcp-server-x86_64-unknown-linux-gnu.tar.gz bitbucket-mcp-server LICENSE README.md
          sha256sum bitbucket-mcp-server-x86_64-unknown-linux-gnu.tar.gz > checksums.txt
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: bitbucket-mcp-server.cdx.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bitbucket-mcp-server-x86_64-unknown-linux-gnu.tar.gz
            bitbucket-mcp-server.cdx.json
            checksums.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
